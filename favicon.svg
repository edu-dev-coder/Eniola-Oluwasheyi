<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E498" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A3824" />
      <stop offset="100%" stop-color="#041E13" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  <!-- Interlocking wedding rings -->
  <circle cx="42" cy="52" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="58" cy="52" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <!-- Diamond sparkle on top ring -->
  <polygon points="42,24 45,29 50,30 46,34 47,39 42,36 37,39 38,34 34,30 39,29" fill="#FFF8DC" />
</svg>
